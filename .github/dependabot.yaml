version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: monthly
    time: "06:30"
    timezone: America/Los_Angeles
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    react:
      patterns:
      - "react"
      - "react-dom"
      - "@types/react"
      - "@types/react-dom"
    storybook:
      patterns:
      - "storybook*"
      - "@storybook/*"
      - "eslint-plugin-storybook"
    typescript-eslint:
      patterns:
      - "typescript-eslint"
      - "@typescript-eslint/*"
    jest:
      patterns:
      - "jest"
      - "jest-*"
      - "@jest/*"
      - "babel-jest"
      - "@types/jest"
    eslint:
      patterns:
      - "eslint"
      - "@eslint/*"
      - "eslint-*"
      - "@types/eslint"
      exclude-patterns:
      - "eslint-plugin-storybook"
      update-types:
      - "minor"
      - "patch"
    babel:
      patterns:
      - "@babel/*"
      - "@types/babel__*"
      update-types:
      - "minor"
      - "patch"
